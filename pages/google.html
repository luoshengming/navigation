<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google - 搜索引擎</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #4285f4 0%, #34a853 50%, #fbbc05 75%, #ea4335 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 600px;
        }
        h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }
        h1 span:nth-child(1) { color: #4285f4; }
        h1 span:nth-child(2) { color: #ea4335; }
        h1 span:nth-child(3) { color: #fbbc05; }
        h1 span:nth-child(4) { color: #4285f4; }
        h1 span:nth-child(5) { color: #34a853; }
        h1 span:nth-child(6) { color: #ea4335; }
        p {
            color: #666;
            font-size: 18px;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 40px;
            background: #4285f4;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-size: 18px;
            transition: transform 0.3s;
        }
        .btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span></h1>
        <p>全球最大的 UI 学习分享平台</p>
        <p>搜索全球信息，探索无限可能。</p>
        <a href="../cn/index.html" class="btn">返回首页</a>
    </div>
</body>
</html>
