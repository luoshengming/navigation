<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <meta http-equiv="Access-Control-Allow-Origin" content="*">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes">
    <title>📈 价差 (A-B-零值)</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        body {
            background: #0c0f1c;
            background: radial-gradient(circle at 30% 40%, #1b2c42 0%, #030614 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: clamp(8px, 2vw, 20px);
        }

        .dashboard {
            width: 100%;
            max-width: 1400px;
            background: rgba(10, 22, 38, 0.75);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: clamp(28px, 4vw, 44px);
            border: 1px solid rgba(74, 158, 255, 0.3);
            padding: clamp(16px, 3vw, 28px) clamp(14px, 2.5vw, 30px);
            box-shadow: 0 40px 70px -40px black, 0 0 0 1px rgba(0, 180, 255, 0.15) inset;
        }

        .header {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 16px 20px;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: clamp(1.6rem, 5vw, 2.2rem);
            font-weight: 600;
            background: linear-gradient(145deg, #eaf3ff, #7ab7ff, #3d8cff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.3px;
            text-shadow: 0 0 30px #3b82f6aa;
        }

        .header h1 i {
            color: #fcd34d;
            filter: drop-shadow(0 0 12px #fbbf24);
            font-size: 1.2em;
        }

        .input-panel {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 8px 12px;
            background: rgba(0, 15, 30, 0.6);
            padding: 10px 20px;
            border-radius: 60px;
            border: 1px solid #3d70b0;
            box-shadow: 0 0 16px #3b82f640, inset 0 1px 2px #ffffff15;
            backdrop-filter: blur(8px);
            flex: 1 1 auto;
            min-width: min(400px, 100%);
        }

        .code-input, .zero-input {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #3865a0;
            color: white;
            padding: 12px 10px;
            border-radius: 40px;
            font-size: 1rem;
            text-align: center;
            outline: none;
            transition: 0.2s;
            font-weight: 500;
            backdrop-filter: blur(4px);
            flex: 1 1 100px;
            min-width: 90px;
        }

        .zero-input {
            border-color: #f0b400;
            background: rgba(25, 20, 0, 0.4);
            box-shadow: 0 0 8px #f0b40050;
            flex: 0.8 1 80px;
        }

        .code-input:focus, .zero-input:focus {
            border-color: #ffd966;
            box-shadow: 0 0 24px #f0b400c0;
            background: rgba(30, 40, 60, 0.8);
        }

        .operator-symbol {
            color: #fbbf24;
            font-size: 1.8rem;
            font-weight: 600;
            text-shadow: 0 0 12px #f59e0b;
            line-height: 1;
        }

        .update-btn {
            background: linear-gradient(145deg, #2563eb, #1e3f8f);
            border: 1px solid #7ab7ff;
            color: white;
            padding: 12px 24px;
            border-radius: 42px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 8px 20px -8px #1e3f8f, 0 0 25px #3b82f680;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            flex: 0 1 auto;
        }

        .update-btn:active {
            transform: scale(0.97);
        }

        .info-cards {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            margin: 28px 0 24px;
        }

        @media (min-width: 600px) {
            .info-cards {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .card {
            background: rgba(10, 24, 42, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 30px;
            padding: 20px 22px;
            border: 1px solid #2e4b7c;
            box-shadow: 0 20px 30px -16px black;
            transition: all 0.2s;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #b3ceff;
            font-size: 1.05rem;
            margin-bottom: 12px;
        }

        .card-header i {
            color: #3b82f6;
            width: 24px;
            font-size: 1.2rem;
        }

        .price-large {
            font-size: clamp(2rem, 5vw, 2.8rem);
            font-weight: 600;
            color: white;
            text-shadow: 0 0 20px #3b82f6;
            line-height: 1.2;
        }

        .price-small {
            font-size: 1rem;
            color: #a0c0ff;
            margin-left: 8px;
        }

        .range-info {
            display: flex;
            gap: 20px;
            color: #9bb9f0;
            font-size: 0.95rem;
            margin-top: 12px;
        }

        .spread-card {
            background: linear-gradient(145deg, #12263b, #04182a);
            border: 1.5px solid #f0b400;
            box-shadow: 0 0 30px #f0b40030;
        }

        .spread-card .card-header {
            color: #ffe484;
        }

        .spread-large {
            font-size: clamp(2.4rem, 6vw, 3.4rem);
            font-weight: 700;
            background: linear-gradient(145deg, #fff6c0, #ffb82e);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1.1;
            text-shadow: 0 0 25px #ffb347;
        }

        .time-tag {
            color: #7f9fd0;
            font-size: 0.85rem;
            margin-top: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .mode-badge {
            background: #142845;
            padding: 4px 14px;
            border-radius: 40px;
            color: #b3d0ff;
            font-size: 0.75rem;
            border: 1px solid #3d70b0;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .chart-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 20px 0 16px;
        }

        .chart-tab {
            background: rgba(0, 20, 40, 0.6);
            border: 1px solid #325a8c;
            color: #b3ceff;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.15s;
            backdrop-filter: blur(8px);
            flex: 0 1 auto;
            text-align: center;
            min-width: 80px;
        }

        .chart-tab.active {
            background: linear-gradient(145deg, #2563eb, #1a3e7c);
            color: white;
            border-color: #f0b400;
            box-shadow: 0 0 20px #3b82f6a0;
        }

        .chart-container {
            width: 100%;
            height: clamp(340px, 50vh, 500px);
            background: #030c1a;
            border-radius: 36px;
            border: 1px solid #2e4b7c;
            padding: 4px;
            margin: 15px 0 20px;
            box-shadow: 0 30px 45px -18px black;
        }

        #kline-chart {
            width: 100%;
            height: 100%;
            border-radius: 32px;
        }

        .footer-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            color: #7f9fd0;
            border-top: 1px solid #1d3a60;
            padding-top: 20px;
            margin-top: 10px;
            gap: 14px;
            font-size: 0.9rem;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 30, 40, 0.5);
            padding: 4px 12px;
            border-radius: 30px;
        }

        .live-dot {
            width: 10px;
            height: 10px;
            background: #2ecc71;
            border-radius: 50%;
            box-shadow: 0 0 18px #2ecc71;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 0.7;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        .crosshair-tooltip {
            position: fixed;
            background: rgba(8, 22, 38, 0.98);
            backdrop-filter: blur(18px);
            border: 1px solid #f0b400;
            border-radius: 28px;
            padding: 14px 18px;
            color: white;
            font-size: 0.9rem;
            box-shadow: 0 30px 50px -20px black, 0 0 0 1px #f0b400 inset;
            pointer-events: none;
            z-index: 1000;
            min-width: 250px;
            max-width: 300px;
            transition: opacity 0.1s;
            border-left: 4px solid #f0b400;
        }

        .crosshair-tooltip .time {
            color: #ffd966;
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 6px;
            border-bottom: 1px solid #3265a5;
            padding-bottom: 4px;
        }

        .crosshair-tooltip .price-row {
            display: flex;
            justify-content: space-between;
            margin: 6px 0;
        }

        .crosshair-tooltip .kline-detail {
            margin-top: 8px;
            padding-top: 6px;
            border-top: 1px solid #3265a5;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px 8px;
        }

        .crosshair-tooltip .spread-highlight {
            grid-column: span 2;
            background: rgba(240, 180, 0, 0.15);
            border-radius: 20px;
            padding: 6px;
            text-align: center;
            color: #f0b400;
            font-weight: 700;
        }

        @media (max-width: 420px) {
            .input-panel {
                border-radius: 32px;
                padding: 12px 8px;
            }

            .code-input, .zero-input {
                padding: 10px 5px;
                font-size: 0.9rem;
            }

            .chart-tab {
                padding: 8px 16px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
<div class="dashboard">
    <div class="header">
        <h1><i class="fas fa-chart-scatter"></i> 价差</h1>
        <div class="input-panel">
            <input type="text" class="code-input" id="code1" value="511660" placeholder="代码A">
            <span class="operator-symbol">−</span>
            <input type="text" class="code-input" id="code2" value="511990" placeholder="代码B">
            <span class="operator-symbol">−</span>
            <input type="text" class="zero-input" id="zeroValue" value="0" placeholder="零值">
            <button class="update-btn" id="updateBtn"><i class="fas fa-sync-alt"></i> 刷新</button>
        </div>
    </div>

    <div class="info-cards"> <!-- 卡片内容不变，只改id动态更新部分，代码略缩但保持完整 -->
        <div class="card">
            <div class="card-header"><i class="fas fa-chart-line"></i> <span id="code1Display">511660</span></div>
            <div><span class="price-large" id="price1">--</span> <span class="price-small" id="change1"></span></div>
            <div class="range-info"><span><i class="fas fa-arrow-up" style="color:#4ade80;"></i> <span
                    id="high1">--</span></span><span><i class="fas fa-arrow-down" style="color:#f87171;"></i> <span
                    id="low1">--</span></span></div>
            <div class="time-tag" id="time1"><i class="far fa-clock"></i> --:--:--</div>
        </div>
        <div class="card">
            <div class="card-header"><i class="fas fa-chart-line"></i> <span id="code2Display">511990</span></div>
            <div><span class="price-large" id="price2">--</span> <span class="price-small" id="change2"></span></div>
            <div class="range-info"><span><i class="fas fa-arrow-up" style="color:#4ade80;"></i> <span
                    id="high2">--</span></span><span><i class="fas fa-arrow-down" style="color:#f87171;"></i> <span
                    id="low2">--</span></span></div>
            <div class="time-tag" id="time2"><i class="far fa-clock"></i> --:--:--</div>
        </div>
        <div class="card spread-card">
            <div class="card-header"><i class="fas fa-not-equal" style="color:#f0b400;"></i> 价差 (<span
                    id="code1Short">660</span>-<span id="code2Short">990</span>-<span id="zeroDisplayHeader">0</span>)
            </div>
            <div class="spread-large" id="spreadValue">--</div>
            <div class="range-info"><span><i class="fas fa-arrow-up" style="color:#4ade80;"></i> <span id="spreadHigh">--</span></span><span><i
                    class="fas fa-arrow-down" style="color:#f87171;"></i> <span id="spreadLow">--</span></span></div>
            <div class="time-tag"><span class="mode-badge" id="modeBadge"><i class="fas fa-fingerprint"></i> 滑动查看详情</span>
            </div>
        </div>
    </div>

    <div class="chart-tabs">
        <div class="chart-tab active" id="tabIntraday"><i class="fas fa-clock"></i> 1分钟</div>
        <div class="chart-tab" id="tab5min"><i class="fas fa-hourglass-half"></i> 5分钟</div>
        <div class="chart-tab" id="tabDaily"><i class="fas fa-calendar-alt"></i> 日K</div>
    </div>

    <div class="chart-container">
        <div id="kline-chart"></div>
    </div>

    <div class="footer-bar">
        <div class="live-indicator"><span class="live-dot"></span> 上证所</div>
        <div><i class="fa-regular fa-hand-pointer"></i> 触摸/悬停看细节</div>
        <div><i class="fa-regular fa-clock"></i> 1min/5min/日</div>
    </div>
</div>

<div id="crosshairTooltip" class="crosshair-tooltip" style="display: none;">
    <div class="time" id="tooltipTime">--:--:--</div>
    <div class="price-row"><span class="label" id="tooltipCode1Label">511660:</span> <span class="value"
                                                                                           id="tooltipPrice1">--</span>
    </div>
    <div class="price-row"><span class="label" id="tooltipCode2Label">511990:</span> <span class="value"
                                                                                           id="tooltipPrice2">--</span>
    </div>
    <div class="kline-detail" id="tooltipDetail">
        <div><span class="label">开:</span> <span class="value" id="tooltipOpen">--</span></div>
        <div><span class="label">高:</span> <span class="value" id="tooltipHigh">--</span></div>
        <div><span class="label">低:</span> <span class="value" id="tooltipLow">--</span></div>
        <div><span class="label">收:</span> <span class="value" id="tooltipClose">--</span></div>
        <div class="spread-highlight" id="tooltipSpread">价差: --</div>
    </div>
</div>

<script>
    (function () {
        const chartElement = document.getElementById('kline-chart');
        const chart = LightweightCharts.createChart(chartElement, {
            width: chartElement.clientWidth, height: chartElement.clientHeight,
            layout: {background: {color: '#061020'}, textColor: '#c4d4ff'},
            grid: {vertLines: {color: '#1f3155'}, horzLines: {color: '#1f3155'}},
            timeScale: {timeVisible: true, secondsVisible: false, borderColor: '#3260a5'},
            rightPriceScale: {borderColor: '#3260a5'},
            crosshair: {
                vertLine: {labelBackgroundColor: '#3b82f6', style: 1},
                horzLine: {labelBackgroundColor: '#3b82f6', style: 1}
            },
            watermark: {text: '价差 (A-B-零值)', color: 'rgba(59,130,246,0.2)', fontSize: 18}
        });

        // 三条独立系列
        const series1min = chart.addLineSeries({
            color: '#f0b400',
            lineWidth: 2,
            priceFormat: {precision: 4, minMove: 0.0001},
            title: '1分钟价差'
        });
        const series5min = chart.addLineSeries({
            color: '#60a5fa',
            lineWidth: 2,
            priceFormat: {precision: 4, minMove: 0.0001},
            title: '5分钟价差'
        });
        const seriesDaily = chart.addLineSeries({
            color: '#4ade80',
            lineWidth: 2,
            priceFormat: {precision: 4, minMove: 0.0001},
            title: '日线价差'
        });
        series1min.applyOptions({visible: true});
        series5min.applyOptions({visible: false});
        seriesDaily.applyOptions({visible: false});

        // DOM 简写
        const $ = id => document.getElementById(id);
        const tooltip = $('crosshairTooltip');
        const tooltipTime = $('tooltipTime'), tooltipPrice1 = $('tooltipPrice1'), tooltipPrice2 = $('tooltipPrice2');
        const tooltipOpen = $('tooltipOpen'), tooltipHigh = $('tooltipHigh'), tooltipLow = $('tooltipLow'),
            tooltipClose = $('tooltipClose'), tooltipSpread = $('tooltipSpread');
        const modeBadge = $('modeBadge');
        const tooltipCode1Label = $('tooltipCode1Label'), tooltipCode2Label = $('tooltipCode2Label');
        const zeroInput = $('zeroValue'), zeroDisplayHeader = $('zeroDisplayHeader');
        const spreadValueEl = $('spreadValue'), spreadHighEl = $('spreadHigh'), spreadLowEl = $('spreadLow');

        // 状态：周期数据缓存 + 当前设置
        let intraA, intraB, dailyA, dailyB, fiveA, fiveB;               // 原始数据
        let minuteData = [], fiveData = [], dailyData = [];             // 聚合后的价差k线(对象数组)
        let currentCode1 = '511660', currentCode2 = '511990', currentZero = 0;
        let currentMode = 'intraday';   // 'intraday', '5min', 'daily'
        let refreshTimer = null;        // 当前周期的定时器句柄

        // ----- 数据获取函数 (不变) -----
        function fetchIntraday(code) {
            return new Promise((resolve, reject) => {
                const cb = 'jQuery_intra_' + Date.now() + '_' + Math.random().toString(36).substr(2);
                window[cb] = function (d) {
                    delete window[cb];
                    script.remove();
                    resolve(d);
                };
                const script = document.createElement('script');
                script.src = `https://yunhq.sse.com.cn:32042/v1/sh1/line/${code}?callback=${cb}&select=time%2Cprice%2Cvolume%2Cavg_price%2Camount%2Chighest%2Clowest&_=${Date.now()}`;
                script.onerror = () => {
                    delete window[cb];
                    script.remove();
                    reject();
                };
                document.head.appendChild(script);
                setTimeout(() => {
                    if (window[cb]) {
                        delete window[cb];
                        script.remove();
                        reject();
                    }
                }, 8000);
            });
        }

        function fetchDaily(code) {
            return new Promise((resolve, reject) => {
                const cb = 'jQuery_daily_' + Date.now() + '_' + Math.random().toString(36).substr(2);
                window[cb] = function (d) {
                    delete window[cb];
                    script.remove();
                    resolve(d);
                };
                const script = document.createElement('script');
                script.src = `https://yunhq.sse.com.cn:32042/v1/sh1/dayk/${code}?callback=${cb}&begin=-500&end=-1&period=day&_=${Date.now()}`;
                script.onerror = () => {
                    delete window[cb];
                    script.remove();
                    reject();
                };
                document.head.appendChild(script);
                setTimeout(() => {
                    if (window[cb]) {
                        delete window[cb];
                        script.remove();
                        reject();
                    }
                }, 8000);
            });
        }

        function fetch5minKline(code) {
            return new Promise((resolve, reject) => {
                const cb = 'jQuery_5min_' + Date.now() + '_' + Math.random().toString(36).substr(2);
                window[cb] = function (d) {
                    delete window[cb];
                    script.remove();
                    resolve(d);
                };
                const script = document.createElement('script');
                script.src = `https://yunhq.sse.com.cn:32042/v1/sh1/minutek/${code}?callback=${cb}&begin=-500&end=-1&period=5min&_=${Date.now()}`;
                script.onerror = () => {
                    delete window[cb];
                    script.remove();
                    reject();
                };
                document.head.appendChild(script);
                setTimeout(() => {
                    if (window[cb]) {
                        delete window[cb];
                        script.remove();
                        reject();
                    }
                }, 8000);
            });
        }

        // 时间转换
        function timeToTimestamp(dateStr, timeNum) {
            const d = String(dateStr);
            const year = parseInt(d.slice(0, 4));
            const month = parseInt(d.slice(4, 6)) - 1;
            const day = parseInt(d.slice(6, 8));
            if (timeNum !== undefined) {
                const t = String(timeNum).padStart(6, '0');
                return Date.UTC(year, month, day, parseInt(t.slice(0, 2)), parseInt(t.slice(2, 4)), parseInt(t.slice(4, 6))) / 1000;
            }
            return Date.UTC(year, month, day) / 1000;
        }

        // 聚合1分钟价差
        function aggregateMinuteKline(d1, d2) {
            const map = new Map();
            for (let i = 0, len = Math.min(d1.line.length, d2.line.length); i < len; i++) {
                const a = d1.line[i], b = d2.line[i];
                if (a[0] !== b[0]) continue;
                const ts = timeToTimestamp(d1.date, a[0]);
                const spread = a[1] - b[1];
                if (!map.has(ts)) map.set(ts, {
                    time: ts,
                    open: spread,
                    high: spread,
                    low: spread,
                    close: spread,
                    price1: a[1],
                    price2: b[1],
                    timeStr: String(a[0]).padStart(6, '0').replace(/(..)(..)(..)/, '$1:$2:$3')
                });
                else {
                    const k = map.get(ts);
                    k.high = Math.max(k.high, spread);
                    k.low = Math.min(k.low, spread);
                    k.close = spread;
                }
            }
            return [...map.values()].sort((a, b) => a.time - b.time);
        }

        // 构建5分钟价差
        function build5minKline(d1, d2) {
            if (!d1?.kline?.length || !d2?.kline?.length) return [];
            const map2 = new Map(d2.kline.map(item => [item[0], item]));
            const res = [];
            d1.kline.forEach(i1 => {
                const i2 = map2.get(i1[0]);
                if (!i2) return;
                const timeFull = String(i1[0]);
                if (timeFull.length < 14) return;
                const year = parseInt(timeFull.slice(0, 4)), month = parseInt(timeFull.slice(4, 6)) - 1,
                    day = parseInt(timeFull.slice(6, 8));
                const hour = parseInt(timeFull.slice(8, 10)), minute = parseInt(timeFull.slice(10, 12)),
                    second = parseInt(timeFull.slice(12, 14)) || 0;
                const ts = Date.UTC(year, month, day, hour, minute, second) / 1000;
                const spread = i1[4] - i2[4]; // 收盘价差
                res.push({
                    time: ts,
                    value: spread,
                    open: spread,
                    high: spread,
                    low: spread,
                    close: spread,
                    price1: i1[4],
                    price2: i2[4],
                    timeStr: `${String(hour).padStart(2, '0')}:${String(minute).padStart(2, '0')}:${String(second).padStart(2, '0')}`
                });
            });
            return res.sort((a, b) => a.time - b.time);
        }

        // 构建日线价差
        function buildDailyKline(d1, d2) {
            const map2 = new Map(d2.kline.map(item => [item[0], item]));
            const res = [];
            d1.kline.forEach(i1 => {
                const i2 = map2.get(i1[0]);
                if (!i2) return;
                const spread = i1[4] - i2[4];
                res.push({
                    time: timeToTimestamp(i1[0]),
                    value: spread,
                    open: spread,
                    high: spread,
                    low: spread,
                    close: spread,
                    price1: i1[4],
                    price2: i2[4],
                    dateStr: String(i1[0])
                });
            });
            return res.sort((a, b) => a.time - b.time);
        }

        // 更新卡片 (使用最新原始数据)
        function updateCards() {
            if (!intraA?.line?.length || !intraB?.line?.length) return false;
            const last1 = intraA.line[intraA.line.length - 1], last2 = intraB.line[intraB.line.length - 1];
            $('code1Display').innerText = currentCode1;
            $('code2Display').innerText = currentCode2;
            $('code1Short').innerText = currentCode1.slice(3);
            $('code2Short').innerText = currentCode2.slice(3);
            zeroDisplayHeader.innerText = currentZero;
            tooltipCode1Label.innerText = currentCode1 + ':';
            tooltipCode2Label.innerText = currentCode2 + ':';

            $('price1').innerText = last1[1].toFixed(3);
            $('high1').innerText = intraA.highest.toFixed(3);
            $('low1').innerText = intraA.lowest.toFixed(3);
            const chg1 = ((last1[1] - intraA.prev_close) / intraA.prev_close * 100).toFixed(2);
            $('change1').innerHTML = (chg1 > 0 ? '+' : '') + chg1 + '%';
            $('change1').style.color = chg1 >= 0 ? '#4ade80' : '#f87171';
            const t1 = String(last1[0]).padStart(6, '0');
            $('time1').innerHTML = `<i class="far fa-clock"></i> ${t1.slice(0, 2)}:${t1.slice(2, 4)}:${t1.slice(4, 6)}`;

            $('price2').innerText = last2[1].toFixed(3);
            $('high2').innerText = intraB.highest.toFixed(3);
            $('low2').innerText = intraB.lowest.toFixed(3);
            const chg2 = ((last2[1] - intraB.prev_close) / intraB.prev_close * 100).toFixed(2);
            $('change2').innerHTML = (chg2 > 0 ? '+' : '') + chg2 + '%';
            $('change2').style.color = chg2 >= 0 ? '#4ade80' : '#f87171';
            const t2 = String(last2[0]).padStart(6, '0');
            $('time2').innerHTML = `<i class="far fa-clock"></i> ${t2.slice(0, 2)}:${t2.slice(2, 4)}:${t2.slice(4, 6)}`;

            const adj = (last1[1] - last2[1] - currentZero).toFixed(4);
            spreadValueEl.innerText = adj;
            let maxS = -Infinity, minS = Infinity;
            for (let i = 0, len = Math.min(intraA.line.length, intraB.line.length); i < len; i++) {
                const s = intraA.line[i][1] - intraB.line[i][1];
                maxS = Math.max(maxS, s);
                minS = Math.min(minS, s);
            }
            spreadHighEl.innerText = (maxS - currentZero).toFixed(4);
            spreadLowEl.innerText = (minS - currentZero).toFixed(4);
            return true;
        }

        // 核心：仅刷新当前周期数据并重新渲染图表
        async function refreshCurrentPeriod() {
            if (!currentCode1 || !currentCode2) return;
            try {
                if (currentMode === 'intraday') {
                    // 只刷新分时，其他保持不变
                    const [newA, newB] = await Promise.all([fetchIntraday(currentCode1), fetchIntraday(currentCode2)]);
                    intraA = newA;
                    intraB = newB;
                    minuteData = aggregateMinuteKline(intraA, intraB);
                    if (minuteData.length) series1min.setData(minuteData.map(k => ({
                        time: k.time,
                        value: k.close - currentZero
                    })));
                } else if (currentMode === '5min') {
                    const [new5A, new5B] = await Promise.all([fetch5minKline(currentCode1), fetch5minKline(currentCode2)]);
                    fiveA = new5A;
                    fiveB = new5B;
                    fiveData = build5minKline(fiveA, fiveB);
                    if (fiveData.length) series5min.setData(fiveData.map(k => ({
                        time: k.time,
                        value: k.close - currentZero
                    })));
                } else if (currentMode === 'daily') {
                    const [newDA, newDB] = await Promise.all([fetchDaily(currentCode1), fetchDaily(currentCode2)]);
                    dailyA = newDA;
                    dailyB = newDB;
                    dailyData = buildDailyKline(dailyA, dailyB);
                    if (dailyData.length) seriesDaily.setData(dailyData.map(k => ({
                        time: k.time,
                        value: k.close - currentZero
                    })));
                }
                // 卡片更新（始终使用最新intra数据，如果没有intra则不强制）
                if (intraA && intraB) updateCards();
                chart.timeScale().fitContent();
            } catch (e) {
                console.warn('周期刷新失败', e);
            }
        }

        // 清除并启动新定时器 (根据当前模式)
        function restartTimer() {
            if (refreshTimer) clearInterval(refreshTimer);
            let intervalMs = 60000; // 默认1分钟
            if (currentMode === '5min') intervalMs = 300000;  // 5分钟
            else if (currentMode === 'daily') intervalMs = 120000; // 日线用2分钟
            refreshTimer = setInterval(() => refreshCurrentPeriod(), intervalMs);
            // 立即刷新一次周期数据，保证图表更新
            refreshCurrentPeriod();
        }

        // 切换tab时：更新active、切换系列可见性、更换currentMode、重启定时器
        function setMode(mode) {
            currentMode = mode;
            // 更新tab样式
            $('tabIntraday').classList.toggle('active', mode === 'intraday');
            $('tab5min').classList.toggle('active', mode === '5min');
            $('tabDaily').classList.toggle('active', mode === 'daily');

            // 控制系列显示
            series1min.applyOptions({visible: mode === 'intraday'});
            series5min.applyOptions({visible: mode === '5min'});
            seriesDaily.applyOptions({visible: mode === 'daily'});

            // 根据当前模式，如果已有缓存数据则立刻设置一次数据（保证切换后看到的是旧数据，同时后台刷新会覆盖）
            if (mode === 'intraday' && minuteData.length) series1min.setData(minuteData.map(k => ({
                time: k.time,
                value: k.close - currentZero
            })));
            if (mode === '5min' && fiveData.length) series5min.setData(fiveData.map(k => ({
                time: k.time,
                value: k.close - currentZero
            })));
            if (mode === 'daily' && dailyData.length) seriesDaily.setData(dailyData.map(k => ({
                time: k.time,
                value: k.close - currentZero
            })));

            // 重启定时器（会立即调用refreshCurrentPeriod，获取最新数据并更新对应系列）
            restartTimer();
        }

        // 全量刷新（点击更新按钮时只刷新当前周期，不重新拉所有数据）
        $('updateBtn').addEventListener('click', () => {
            const newCode1 = $('code1').value.trim().toUpperCase() || '511660';
            const newCode2 = $('code2').value.trim().toUpperCase() || '511990';
            const newZero = parseFloat($('zeroValue').value) || 0;
            // 如果代码或零值变化，需要重置所有缓存，重新拉一次当前周期（为了保证卡片正确，同时拉intra）
            if (newCode1 !== currentCode1 || newCode2 !== currentCode2 || newZero !== currentZero) {
                currentCode1 = newCode1;
                currentCode2 = newCode2;
                currentZero = newZero;
                // 全部缓存清空，重新拉取当前周期 + 分时（为了卡片）
                (async () => {
                    try {
                        const [iA, iB] = await Promise.all([fetchIntraday(currentCode1), fetchIntraday(currentCode2)]);
                        intraA = iA;
                        intraB = iB;
                        minuteData = aggregateMinuteKline(intraA, intraB);
                        // 再拉取其他周期缓存备用
                        const [dA, dB, fA, fB] = await Promise.all([fetchDaily(currentCode1), fetchDaily(currentCode2), fetch5minKline(currentCode1), fetch5minKline(currentCode2)]);
                        dailyA = dA;
                        dailyB = dB;
                        fiveA = fA;
                        fiveB = fB;
                        dailyData = buildDailyKline(dailyA, dailyB);
                        fiveData = build5minKline(fiveA, fiveB);
                        updateCards();
                        // 根据当前模式展示对应数据
                        if (currentMode === 'intraday') series1min.setData(minuteData.map(k => ({
                            time: k.time,
                            value: k.close - currentZero
                        })));
                        else if (currentMode === '5min') series5min.setData(fiveData.map(k => ({
                            time: k.time,
                            value: k.close - currentZero
                        })));
                        else if (currentMode === 'daily') seriesDaily.setData(dailyData.map(k => ({
                            time: k.time,
                            value: k.close - currentZero
                        })));
                        chart.timeScale().fitContent();
                    } catch (e) {
                        console.warn(e);
                    }
                })();
            } else {
                // 仅刷新当前周期（代码不变）
                refreshCurrentPeriod();
            }
        });

        // tab点击绑定
        $('tabIntraday').addEventListener('click', () => setMode('intraday'));
        $('tab5min').addEventListener('click', () => setMode('5min'));
        $('tabDaily').addEventListener('click', () => setMode('daily'));

        // 初始化：拉取所有数据并设置1min模式
        (async function init() {
            try {
                const [iA, iB, dA, dB, fA, fB] = await Promise.all([
                    fetchIntraday('511660'), fetchIntraday('511990'),
                    fetchDaily('511660'), fetchDaily('511990'),
                    fetch5minKline('511660'), fetch5minKline('511990')
                ]);
                intraA = iA;
                intraB = iB;
                dailyA = dA;
                dailyB = dB;
                fiveA = fA;
                fiveB = fB;
                minuteData = aggregateMinuteKline(intraA, intraB);
                dailyData = buildDailyKline(dailyA, dailyB);
                fiveData = build5minKline(fiveA, fiveB);
                updateCards();
                series1min.setData(minuteData.map(k => ({time: k.time, value: k.close - currentZero})));
                chart.timeScale().fitContent();
                // 启动1min定时器
                setMode('intraday');
            } catch (e) {
                console.warn('初始化失败', e);
            }
        })();

        // 十字光标逻辑 (略做适配，与原版相同)
        function findPoint(ts) {
            let arr = currentMode === 'intraday' ? minuteData : currentMode === '5min' ? fiveData : dailyData;
            if (!arr.length) return null;
            return arr.reduce((a, b) => Math.abs(a.time - ts) < Math.abs(b.time - ts) ? a : b);
        }

        chart.subscribeCrosshairMove(param => {
            if (!param.time) {
                tooltip.style.display = 'none';
                modeBadge.innerHTML = '<i class="fas fa-fingerprint"></i> 滑动查看详情';
                return;
            }
            const pt = findPoint(param.time);
            if (!pt) return;
            tooltip.style.display = 'block';
            if (currentMode === 'intraday' || currentMode === '5min') tooltipTime.innerText = pt.timeStr || '--:--:--';
            else tooltipTime.innerText = pt.dateStr ? `${pt.dateStr.slice(0, 4)}-${pt.dateStr.slice(4, 6)}-${pt.dateStr.slice(6, 8)}` : '--';
            tooltipPrice1.innerText = pt.price1?.toFixed(3) || '--';
            tooltipPrice2.innerText = pt.price2?.toFixed(3) || '--';
            const adj = (pt.close - currentZero).toFixed(4);
            tooltipOpen.innerText = adj;
            tooltipHigh.innerText = adj;
            tooltipLow.innerText = adj;
            tooltipClose.innerText = adj;
            tooltipSpread.innerText = `价差: ${adj}`;
            spreadValueEl.innerText = adj;
            modeBadge.innerHTML = currentMode === 'intraday' ? '<i class="fas fa-clock"></i> 1分点' : currentMode === '5min' ? '<i class="fas fa-hourglass-half"></i> 5分点' : '<i class="fas fa-calendar"></i> 日K点';
            if (param.point) {
                const rect = chartElement.getBoundingClientRect();
                let left = param.point.x + rect.left + 8, top = param.point.y + rect.top - 70;
                const w = 260, h = 240;
                if (left + w > window.innerWidth) left = param.point.x + rect.left - w - 8;
                if (top < 5) top = param.point.y + rect.top + 20;
                if (top + h > window.innerHeight) top = window.innerHeight - h - 8;
                tooltip.style.left = left + 'px';
                tooltip.style.top = top + 'px';
            }
        });
        chartElement.addEventListener('mouseleave', () => {
            tooltip.style.display = 'none';
            modeBadge.innerHTML = '<i class="fas fa-fingerprint"></i> 滑动查看详情';
        });
        window.addEventListener('resize', () => {
            chart.applyOptions({width: chartElement.clientWidth, height: chartElement.clientHeight});
        });
    })();
</script>
</body>
</html>
