<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 关键：移动端视口设置 + 缩放控制 -->
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <meta http-equiv="Access-Control-Allow-Origin" content="*">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>📱 双周期价差 · 手机适配版</title>
    <!-- TradingView Lightweight Charts (保持相同版本) -->
    <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        body {
            background: #0a0c18;
            background-image: radial-gradient(circle at 70% 30%, #1a2f4a 0%, #020410 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;  /* 顶部对齐，移动端更自然 */
            padding: 8px;             /* 边距缩小 */
        }

        .dashboard {
            max-width: 1500px;
            width: 100%;
            background: rgba(8, 18, 32, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 32px;       /* 稍微减小圆角 */
            border: 1px solid rgba(0, 200, 255, 0.3);
            padding: 16px 16px 20px;   /* 左右边距收窄 */
            box-shadow: 0 30px 60px -20px black, 0 0 40px rgba(0, 160, 255, 0.2) inset;
        }

        /* 头部flex换行，移动端紧凑 */
        .header {
            display: flex;
            flex-direction: column;     /* 手机上一列显示 */
            align-items: stretch;
            gap: 12px;
            margin-bottom: 18px;
        }

        .header h1 {
            font-size: 1.8rem;          /* 调小一点 */
            background: linear-gradient(145deg, #c0e0ff, #4d9eff, #3b82f6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 20px #3b82f6;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
        }

        .header h1 i {
            color: #ffd966;
            margin-right: 10px;
            filter: drop-shadow(0 0 10px #f0b400);
        }

        /* 输入面板改为纵向、宽度自适应 - 现在有三个输入框 */
        .input-panel {
            display: flex;
            flex-direction: row;        /* 保持行内，但允许换行 */
            flex-wrap: wrap;
            gap: 8px;
            background: rgba(0, 20, 40, 0.6);
            padding: 12px 16px;
            border-radius: 48px;
            border: 1px solid #3b82f6;
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
        }

        .code-input {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid #2f5080;
            color: white;
            padding: 12px 10px;
            border-radius: 40px;
            width: 120px;               /* 调整宽度以适应三个输入框 */
            font-size: 1rem;
            text-align: center;
            outline: none;
            transition: 0.2s;
            flex: 1 1 auto;              /* 允许伸缩 */
        }

        .zero-input {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid #f0b400;   /* 金色边框突出显示 */
            color: white;
            padding: 12px 10px;
            border-radius: 40px;
            width: 80px;                  /* 零值输入框稍窄 */
            font-size: 1rem;
            text-align: center;
            outline: none;
            transition: 0.2s;
            flex: 1 1 auto;
        }

        .zero-input:focus {
            border-color: #ffd966;
            box-shadow: 0 0 20px #f0b40080;
        }

        .code-input:focus {
            border-color: #ffd966;
            box-shadow: 0 0 20px #f0b40040;
        }

        .operator-symbol {
            color: #ffb347;
            font-size: 1.5rem;
            font-weight: bold;
            margin: 0 2px;
        }

        .update-btn {
            background: linear-gradient(145deg, #3b82f6, #1e4b9e);
            border: none;
            color: white;
            padding: 12px 20px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid #90ccff;
            box-shadow: 0 0 20px #3b82f680;
            flex: 1 1 100px;
            white-space: nowrap;
        }

        .update-btn:hover {
            transform: scale(1.02);      /* 手机hover效果不明显，保留 */
        }

        /* 卡片区：移动端堆叠 + 内边距缩小 */
        .info-cards {
            display: grid;
            grid-template-columns: 1fr;  /* 手机上一列 */
            gap: 12px;
            margin: 20px 0 18px;
        }

        .card {
            background: rgba(0, 15, 30, 0.7);
            border-radius: 28px;
            padding: 18px;                /* 内边距缩小 */
            border: 1px solid #2f5080;
            backdrop-filter: blur(8px);
            box-shadow: 0 12px 28px -10px black;
            transition: 0.2s;
            overflow: hidden;
        }

        .card-header {
            color: #9bb9f0;
            font-size: 1rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
        }

        .card-header i {
            color: #3b82f6;
            margin-right: 8px;
        }

        .price-large {
            font-size: 2.2rem;           /* 手机上略小 */
            font-weight: 600;
            color: white;
            text-shadow: 0 0 15px #3b82f6;
        }

        .price-small {
            font-size: 1rem;
            color: #9bb9f0;
            margin-left: 8px;
        }

        .range-info {
            color: #7f9fd5;
            margin-top: 8px;
            font-size: 0.9rem;
            display: flex;
            gap: 15px;
        }

        .spread-card {
            background: linear-gradient(145deg, #142b44, #021222);
            border: 2px solid #f0b400;
        }

        .spread-large {
            font-size: 2.6rem;           /* 手机适配 */
            font-weight: 700;
            background: linear-gradient(145deg, #fff2b5, #ffb347);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1.2;
        }

        /* 零值信息卡片 - 新增 */
        .zero-card {
            background: linear-gradient(145deg, #1a2a3a, #0a1a2a);
            border: 2px solid #3b82f6;
            margin-top: 5px;
        }

        .zero-value {
            font-size: 2rem;
            font-weight: 600;
            color: #ffb347;
            text-shadow: 0 0 15px #f0b400;
        }

        /* 图表容器高度适当降低，避免占满屏 */
        .chart-container {
            width: 100%;
            height: 400px;                /* 手机400px够用 */
            background: #030b18;
            border-radius: 32px;
            border: 1px solid #2f4f8a;
            padding: 6px;
            margin: 15px 0 15px;
            box-shadow: 0 20px 40px -10px black;
        }

        #kline-chart {
            width: 100%;
            height: 100%;
            border-radius: 28px;
        }

        /* 图表切换栏flex换行 */
        .chart-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
            justify-content: center;
        }

        .chart-tab {
            background: rgba(0, 20, 40, 0.6);
            border: 1px solid #2f5080;
            color: #9bb9f0;
            padding: 8px 20px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.95rem;
            backdrop-filter: blur(8px);
            flex: 1 1 auto;
            text-align: center;
            white-space: nowrap;
        }

        .chart-tab.active {
            background: linear-gradient(145deg, #3b82f6, #1e4b9e);
            color: white;
            border-color: #ffd966;
            box-shadow: 0 0 20px #3b82f680;
        }

        .footer-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            color: #7f9fd0;
            border-top: 1px solid #1d3a60;
            padding-top: 16px;
            margin-top: 8px;
            gap: 8px;
            font-size: 0.85rem;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .live-dot {
            width: 10px;
            height: 10px;
            background: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 18px #22c55e;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .time-tag {
            color: #ffb347;
            font-size: 0.8rem;
            margin-top: 5px;
        }

        .mode-badge {
            background: rgba(0, 0, 0, 0.4);
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 0.7rem;
            color: #9bb9f0;
            display: inline-block;
        }

        /* 鼠标悬浮提示——手机上是跟随触摸，调整定位为更友好（不超出屏幕） */
        .crosshair-tooltip {
            position: fixed;
            background: rgba(0, 20, 40, 0.98);
            backdrop-filter: blur(10px);
            border: 2px solid #f0b400;
            border-radius: 16px;
            padding: 10px 14px;
            color: white;
            font-size: 0.9rem;
            box-shadow: 0 0 30px #f0b40040;
            pointer-events: none;
            z-index: 1000;
            min-width: 240px;
            max-width: 280px;
            transition: opacity 0.15s;
            border-left: 4px solid #f0b400;
        }

        .crosshair-tooltip .time {
            color: #ffd966;
            font-size: 1rem;
            margin-bottom: 6px;
            border-bottom: 1px solid #3b82f6;
            padding-bottom: 4px;
        }

        .crosshair-tooltip .price-row {
            display: flex;
            justify-content: space-between;
            margin: 4px 0;
        }

        .crosshair-tooltip .label {
            color: #9bb9f0;
        }

        .crosshair-tooltip .value {
            color: white;
            font-weight: 600;
        }

        .crosshair-tooltip .kline-detail {
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid #3b82f6;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px 8px;
        }

        .crosshair-tooltip .spread-highlight {
            color: #f0b400;
            font-size: 1.1rem;
            font-weight: 700;
            grid-column: span 2;
            text-align: center;
            background: rgba(240, 180, 0, 0.1);
            padding: 4px;
            border-radius: 8px;
        }

        /* 极小屏额外优化 */
        @media (max-width: 480px) {
            .header h1 { font-size: 1.5rem; }
            .price-large { font-size: 1.9rem; }
            .spread-large { font-size: 2.2rem; }
            .code-input { width: 100px; }
            .zero-input { width: 70px; }
            .input-panel { padding: 10px; }
            .chart-container { height: 350px; }
        }
    </style>
</head>
<body>
<div class="dashboard">
    <!-- 标题和输入区 - 移动友好，现在有三个输入框 -->
    <div class="header">
        <h1><i class="fas fa-chart-gantt"></i> 双周期价差·手机版</h1>
        <div class="input-panel">
            <input type="text" class="code-input" id="code1" value="511660" placeholder="代码A">
            <span class="operator-symbol">−</span>
            <input type="text" class="code-input" id="code2" value="511990" placeholder="代码B">
            <span class="operator-symbol">−</span>
            <input type="text" class="zero-input" id="zeroValue" value="0" placeholder="0">
            <button class="update-btn" id="updateBtn"><i class="fas fa-sync-alt"></i> 更新</button>
        </div>
    </div>

    <!-- 实时卡片 - 垂直排列（已通过grid实现） -->
    <div class="info-cards" id="infoCards">
        <div class="card">
            <div class="card-header"><i class="fas fa-chart-line"></i> <span id="code1Display">511660</span></div>
            <div>
                <span class="price-large" id="price1">--</span>
                <span class="price-small" id="change1"></span>
            </div>
            <div class="range-info">
                <span><i class="fas fa-arrow-up" style="color:#4ade80;"></i> <span id="high1">--</span></span>
                <span><i class="fas fa-arrow-down" style="color:#f87171;"></i> <span id="low1">--</span></span>
            </div>
            <div class="time-tag" id="time1">--</div>
        </div>
        <div class="card">
            <div class="card-header"><i class="fas fa-chart-line"></i> <span id="code2Display">511990</span></div>
            <div>
                <span class="price-large" id="price2">--</span>
                <span class="price-small" id="change2"></span>
            </div>
            <div class="range-info">
                <span><i class="fas fa-arrow-up" style="color:#4ade80;"></i> <span id="high2">--</span></span>
                <span><i class="fas fa-arrow-down" style="color:#f87171;"></i> <span id="low2">--</span></span>
            </div>
            <div class="time-tag" id="time2">--</div>
        </div>
        <div class="card spread-card" id="spreadCard">
            <div class="card-header" style="color:#ffd966;">
                <i class="fas fa-not-equal"></i> 价差 (<span id="code1Short">660</span>-<span id="code2Short">990</span>)
            </div>
            <div class="spread-large" id="spreadValue">--</div>
            <div class="range-info">
                <span><i class="fas fa-arrow-up" style="color:#4ade80;"></i> <span id="spreadHigh">--</span></span>
                <span><i class="fas fa-arrow-down" style="color:#f87171;"></i> <span id="spreadLow">--</span></span>
            </div>
            <div class="time-tag" id="spreadTime">
                <span class="mode-badge" id="modeBadge"><i class="fas fa-mouse-pointer"></i> 触摸查看</span>
            </div>
        </div>
        <!-- 新增的零值卡片 -->
        <div class="card zero-card">
            <div class="card-header"><i class="fas fa-circle"></i> A - B - <span id="zeroDisplay">0</span></div>
            <div>
                <span class="zero-value" id="adjustedSpread">--</span>
                <span class="price-small">调整后价差</span>
            </div>
            <div class="range-info">
                <span><i class="fas fa-info-circle"></i> 零值: <span id="currentZero">0</span></span>
            </div>
        </div>
    </div>

    <!-- 图表切换栏 -->
    <div class="chart-tabs">
        <div class="chart-tab active" id="tabIntraday"><i class="fas fa-clock"></i> 分时 (1分钟)</div>
        <div class="chart-tab" id="tabDaily"><i class="fas fa-calendar-alt"></i> 日K线</div>
    </div>

    <!-- 图表容器 -->
    <div class="chart-container">
        <div id="kline-chart"></div>
    </div>

    <!-- 底部状态 -->
    <div class="footer-bar">
        <div class="live-indicator">
            <span class="live-dot"></span> 上证所
        </div>
        <div><i class="fas fa-hand-pointer"></i> 触摸显示详情</div>
        <div><i class="fas fa-microchip"></i> 双周期 + 零值</div>
    </div>
</div>

<!-- 触摸/鼠标跟随工具提示 -->
<div id="crosshairTooltip" class="crosshair-tooltip" style="display: none; opacity: 0;">
    <div class="time" id="tooltipTime">--:--:--</div>
    <div class="price-row">
        <span class="label" id="tooltipCode1Label">511660:</span>
        <span class="value" id="tooltipPrice1">--</span>
    </div>
    <div class="price-row">
        <span class="label" id="tooltipCode2Label">511990:</span>
        <span class="value" id="tooltipPrice2">--</span>
    </div>
    <div class="kline-detail" id="tooltipDetail">
        <div class="price-row">
            <span class="label">开:</span>
            <span class="value" id="tooltipOpen">--</span>
        </div>
        <div class="price-row">
            <span class="label">高:</span>
            <span class="value" id="tooltipHigh">--</span>
        </div>
        <div class="price-row">
            <span class="label">低:</span>
            <span class="value" id="tooltipLow">--</span>
        </div>
        <div class="price-row">
            <span class="label">收:</span>
            <span class="value" id="tooltipClose">--</span>
        </div>
        <div class="spread-highlight" id="tooltipSpread">价差: --</div>
    </div>
</div>

<script>
    (function() {
        // --- 保证数据请求能适配手机 (主要问题是跨域/JSONP，原有逻辑不变，但增加移动端超时提醒) ---
        const chartElement = document.getElementById('kline-chart');

        // 创建图表 (尺寸由CSS控制，初始化时设置width/height为容器宽高，后续resize处理)
        const chart = LightweightCharts.createChart(chartElement, {
            width: chartElement.clientWidth,
            height: chartElement.clientHeight,
            layout: {
                background: { color: '#051020' },
                textColor: '#c0d0f0',
            },
            grid: {
                vertLines: { color: '#1f3150' },
                horzLines: { color: '#1f3150' },
            },
            timeScale: {
                timeVisible: true,
                secondsVisible: false,
                borderColor: '#2f4880',
            },
            rightPriceScale: {
                borderColor: '#2f4880',
            },
            crosshair: {
                vertLine: {
                    labelBackgroundColor: '#3b82f6',
                    visible: true,
                    style: 1,
                },
                horzLine: {
                    labelBackgroundColor: '#3b82f6',
                    visible: true,
                    style: 1,
                },
                mode: 1,
            },
            watermark: {
                text: '价差分析',
                color: 'rgba(59,130,246,0.2)',
                fontSize: 20,
            },
            // 移动端适合触控，增加handleScroll和handleScale选项（默认已开启）
        });

        const lineSeries = chart.addLineSeries({
            color: '#f0b400',
            lineWidth: 2,
            priceFormat: {
                type: 'price',
                precision: 4,
                minMove: 0.0001,
            },
        });

        const candlestickSeries = chart.addCandlestickSeries({
            upColor: '#4ade80',
            downColor: '#f87171',
            borderVisible: false,
            wickUpColor: '#4ade80',
            wickDownColor: '#f87171',
            borderColor: '#4ade80',
            priceFormat: {
                type: 'price',
                precision: 4,
                minMove: 0.0001,
            },
        });

        candlestickSeries.applyOptions({ visible: false });

        // 工具提示
        const tooltip = document.getElementById('crosshairTooltip');
        const tooltipTime = document.getElementById('tooltipTime');
        const tooltipPrice1 = document.getElementById('tooltipPrice1');
        const tooltipPrice2 = document.getElementById('tooltipPrice2');
        const tooltipOpen = document.getElementById('tooltipOpen');
        const tooltipHigh = document.getElementById('tooltipHigh');
        const tooltipLow = document.getElementById('tooltipLow');
        const tooltipClose = document.getElementById('tooltipClose');
        const tooltipSpread = document.getElementById('tooltipSpread');
        const tooltipDetail = document.getElementById('tooltipDetail');
        const tooltipCode1Label = document.getElementById('tooltipCode1Label');
        const tooltipCode2Label = document.getElementById('tooltipCode2Label');
        const modeBadge = document.getElementById('modeBadge');

        // 新增的零值相关元素
        const zeroInput = document.getElementById('zeroValue');
        const zeroDisplay = document.getElementById('zeroDisplay');
        const currentZero = document.getElementById('currentZero');
        const adjustedSpread = document.getElementById('adjustedSpread');

        // 存储数据
        let intradayData1 = null, intradayData2 = null, dailyData1 = null, dailyData2 = null;
        let currentCode1 = '511660', currentCode2 = '511990';
        let currentZeroValue = 0;
        let currentMode = 'intraday';
        let minuteKlineData = [], dailyKlineData = [];

        // 标签切换
        document.getElementById('tabIntraday').addEventListener('click', () => {
            document.getElementById('tabIntraday').classList.add('active');
            document.getElementById('tabDaily').classList.remove('active');
            currentMode = 'intraday';
            lineSeries.applyOptions({ visible: true });
            candlestickSeries.applyOptions({ visible: false });
            if (minuteKlineData.length > 0) {
                lineSeries.setData(minuteKlineData.map(k => ({ time: k.time, value: k.close })));
                chart.timeScale().fitContent();
            }
        });

        document.getElementById('tabDaily').addEventListener('click', () => {
            document.getElementById('tabDaily').classList.add('active');
            document.getElementById('tabIntraday').classList.remove('active');
            currentMode = 'daily';
            lineSeries.applyOptions({ visible: false });
            candlestickSeries.applyOptions({ visible: true });
            if (dailyKlineData.length > 0) {
                candlestickSeries.setData(dailyKlineData);
                chart.timeScale().fitContent();
            }
        });

        // 时间转换函数 (与原来相同)
        function timeToTimestamp(dateStr, timeNum) {
            const date = String(dateStr);
            const year = parseInt(date.substring(0, 4));
            const month = parseInt(date.substring(4, 6)) - 1;
            const day = parseInt(date.substring(6, 8));
            if (timeNum !== undefined) {
                const time = String(timeNum).padStart(6, '0');
                const hours = parseInt(time.substring(0, 2));
                const minutes = parseInt(time.substring(2, 4));
                const seconds = parseInt(time.substring(4, 6));
                return Date.UTC(year, month, day, hours, minutes, seconds) / 1000;
            }
            return Date.UTC(year, month, day) / 1000;
        }

        // 获取分时数据 (JSONP, 手机端同样工作)
        function fetchIntraday(code) {
            return new Promise((resolve, reject) => {
                const cbName = 'jQuery_' + Date.now() + '_' + Math.floor(Math.random() * 1000000);
                const url = `https://yunhq.sse.com.cn:32042/v1/sh1/line/${code}?callback=${cbName}&select=time%2Cprice%2Cvolume%2Cavg_price%2Camount%2Chighest%2Clowest&_=${Date.now()}`;

                window[cbName] = function(data) {
                    delete window[cbName];
                    if (script.parentNode) script.parentNode.removeChild(script);
                    resolve(data);
                };

                const script = document.createElement('script');
                script.src = url;
                script.onerror = () => {
                    delete window[cbName];
                    if (script.parentNode) script.parentNode.removeChild(script);
                    reject(new Error(`获取 ${code} 分时数据失败`));
                };
                document.head.appendChild(script);

                // 超时处理 (移动端网络可能慢)
                setTimeout(() => {
                    if (window[cbName]) {
                        delete window[cbName];
                        if (script.parentNode) script.parentNode.removeChild(script);
                        reject(new Error(`获取 ${code} 超时`));
                    }
                }, 8000);
            });
        }

        // 获取日K线数据
        function fetchDaily(code) {
            return new Promise((resolve, reject) => {
                const cbName = 'jQuery_' + Date.now() + '_' + Math.floor(Math.random() * 1000000);
                const url = `https://yunhq.sse.com.cn:32042/v1/sh1/dayk/${code}?callback=${cbName}&begin=-500&end=-1&period=day&_=${Date.now()}`;

                window[cbName] = function(data) {
                    delete window[cbName];
                    if (script.parentNode) script.parentNode.removeChild(script);
                    resolve(data);
                };

                const script = document.createElement('script');
                script.src = url;
                script.onerror = () => {
                    delete window[cbName];
                    if (script.parentNode) script.parentNode.removeChild(script);
                    reject(new Error(`获取 ${code} 日K数据失败`));
                };
                document.head.appendChild(script);

                setTimeout(() => {
                    if (window[cbName]) {
                        delete window[cbName];
                        if (script.parentNode) script.parentNode.removeChild(script);
                        reject(new Error(`获取 ${code} 日K超时`));
                    }
                }, 8000);
            });
        }

        // 聚合1分钟K线 (原样)
        function aggregateMinuteKline(data1, data2) {
            const klineMap = new Map();
            const minLength = Math.min(data1.line.length, data2.line.length);
            for (let i = 0; i < minLength; i++) {
                const item1 = data1.line[i];
                const item2 = data2.line[i];
                if (item1[0] !== item2[0]) continue;
                const timestamp = timeToTimestamp(data1.date, item1[0]);
                const spread = item1[1] - item2[1];
                if (!klineMap.has(timestamp)) {
                    klineMap.set(timestamp, {
                        time: timestamp,
                        open: spread,
                        high: spread,
                        low: spread,
                        close: spread,
                        price1: item1[1],
                        price2: item2[1],
                        timeStr: String(item1[0]).padStart(6, '0')
                    });
                } else {
                    const kline = klineMap.get(timestamp);
                    kline.high = Math.max(kline.high, spread);
                    kline.low = Math.min(kline.low, spread);
                    kline.close = spread;
                    kline.price1 = item1[1];
                    kline.price2 = item2[1];
                }
            }
            return Array.from(klineMap.values()).sort((a, b) => a.time - b.time);
        }

        // 构建日K线 (原样)
        function buildDailyKline(data1, data2) {
            const map2 = new Map();
            data2.kline.forEach(item => map2.set(item[0], item));
            const candles = [];
            data1.kline.forEach(item1 => {
                const date = item1[0];
                const item2 = map2.get(date);
                if (item2) {
                    const open = item1[1] - item2[1];
                    const high = Math.max(
                        item1[2] - item2[2],
                        item1[3] - item2[3],
                        item1[4] - item2[4],
                        open
                    );
                    const low = Math.min(
                        item1[2] - item2[2],
                        item1[3] - item2[3],
                        item1[4] - item2[4],
                        open
                    );
                    const close = item1[4] - item2[4];
                    candles.push({
                        time: timeToTimestamp(date),
                        open: open,
                        high: high,
                        low: low,
                        close: close,
                        price1: item1[4],
                        price2: item2[4],
                        dateStr: String(date)
                    });
                }
            });
            return candles.sort((a, b) => a.time - b.time);
        }

        // 更新卡片UI - 增加了零值处理
        function updateCards(intra1, intra2, daily1, daily2, code1, code2, zeroVal) {
            if (!intra1 || !intra2) return false;
            intradayData1 = intra1;
            intradayData2 = intra2;
            dailyData1 = daily1;
            dailyData2 = daily2;
            currentCode1 = code1;
            currentCode2 = code2;
            currentZeroValue = zeroVal;

            const last1 = intra1.line[intra1.line.length - 1];
            const last2 = intra2.line[intra2.line.length - 1];

            document.getElementById('code1Display').innerText = code1;
            document.getElementById('code2Display').innerText = code2;
            document.getElementById('code1Short').innerText = code1.substring(3);
            document.getElementById('code2Short').innerText = code2.substring(3);
            zeroDisplay.innerText = zeroVal;
            currentZero.innerText = zeroVal;
            tooltipCode1Label.innerText = code1 + ':';
            tooltipCode2Label.innerText = code2 + ':';

            document.getElementById('price1').innerText = last1[1].toFixed(3);
            document.getElementById('high1').innerText = intra1.highest.toFixed(3);
            document.getElementById('low1').innerText = intra1.lowest.toFixed(3);
            const change1 = ((last1[1] - intra1.prev_close) / intra1.prev_close * 100).toFixed(2);
            document.getElementById('change1').innerHTML = (change1 > 0 ? '+' : '') + change1 + '%';
            document.getElementById('change1').style.color = change1 >= 0 ? '#4ade80' : '#f87171';
            const timeStr1 = String(last1[0]).padStart(6, '0');
            document.getElementById('time1').innerHTML = `<i class="far fa-clock"></i> ${timeStr1.substring(0,2)}:${timeStr1.substring(2,4)}:${timeStr1.substring(4,6)}`;

            document.getElementById('price2').innerText = last2[1].toFixed(3);
            document.getElementById('high2').innerText = intra2.highest.toFixed(3);
            document.getElementById('low2').innerText = intra2.lowest.toFixed(3);
            const change2 = ((last2[1] - intra2.prev_close) / intra2.prev_close * 100).toFixed(2);
            document.getElementById('change2').innerHTML = (change2 > 0 ? '+' : '') + change2 + '%';
            document.getElementById('change2').style.color = change2 >= 0 ? '#4ade80' : '#f87171';
            const timeStr2 = String(last2[0]).padStart(6, '0');
            document.getElementById('time2').innerHTML = `<i class="far fa-clock"></i> ${timeStr2.substring(0,2)}:${timeStr2.substring(2,4)}:${timeStr2.substring(4,6)}`;

            const spread = (last1[1] - last2[1]).toFixed(4);
            document.getElementById('spreadValue').innerText = spread;

            // 计算调整后的价差 (A - B - zero)
            const adjusted = (last1[1] - last2[1] - zeroVal).toFixed(4);
            adjustedSpread.innerText = adjusted;

            let maxSpread = -Infinity, minSpread = Infinity;
            const minLength = Math.min(intra1.line.length, intra2.line.length);
            for (let i = 0; i < minLength; i++) {
                const s = intra1.line[i][1] - intra2.line[i][1];
                maxSpread = Math.max(maxSpread, s);
                minSpread = Math.min(minSpread, s);
            }
            document.getElementById('spreadHigh').innerText = maxSpread.toFixed(4);
            document.getElementById('spreadLow').innerText = minSpread.toFixed(4);
            return true;
        }

        // 查找数据点
        function findDataPointByTimestamp(timestamp) {
            if (currentMode === 'intraday') {
                if (!minuteKlineData.length) return null;
                let best = null, minDiff = Infinity;
                for (const k of minuteKlineData) {
                    const diff = Math.abs(k.time - timestamp);
                    if (diff < minDiff) { minDiff = diff; best = k; }
                }
                return best;
            } else {
                if (!dailyKlineData.length) return null;
                let best = null, minDiff = Infinity;
                for (const k of dailyKlineData) {
                    const diff = Math.abs(k.time - timestamp);
                    if (diff < minDiff) { minDiff = diff; best = k; }
                }
                return best;
            }
        }

        // 设置鼠标/触摸跟随 (在移动端同样有效)
        function setupCrosshairMove() {
            chart.subscribeCrosshairMove(param => {
                if (!param.time) {
                    tooltip.style.display = 'none';
                    tooltip.style.opacity = '0';
                    modeBadge.innerHTML = '<i class="fas fa-mouse-pointer"></i> 触摸查看';
                    if (intradayData1 && intradayData2) {
                        const last1 = intradayData1.line[intradayData1.line.length - 1];
                        const last2 = intradayData2.line[intradayData2.line.length - 1];
                        document.getElementById('spreadValue').innerText = (last1[1] - last2[1]).toFixed(4);
                        // 更新调整后价差
                        const adjusted = (last1[1] - last2[1] - currentZeroValue).toFixed(4);
                        adjustedSpread.innerText = adjusted;
                    }
                    return;
                }

                const point = findDataPointByTimestamp(param.time);
                if (!point) return;

                tooltip.style.display = 'block';
                tooltip.style.opacity = '1';

                if (currentMode === 'intraday') {
                    tooltipTime.innerText = `${point.timeStr.substring(0,2)}:${point.timeStr.substring(2,4)}:${point.timeStr.substring(4,6)}`;
                } else {
                    tooltipTime.innerText = `${point.dateStr.substring(0,4)}-${point.dateStr.substring(4,6)}-${point.dateStr.substring(6,8)}`;
                }
                tooltipDetail.style.display = 'grid';
                tooltipPrice1.innerText = point.price1.toFixed(3);
                tooltipPrice2.innerText = point.price2.toFixed(3);
                tooltipOpen.innerText = point.open.toFixed(4);
                tooltipHigh.innerText = point.high.toFixed(4);
                tooltipLow.innerText = point.low.toFixed(4);
                tooltipClose.innerText = point.close.toFixed(4);
                tooltipSpread.innerText = `价差: ${point.close.toFixed(4)}`;
                document.getElementById('spreadValue').innerText = point.close.toFixed(4);

                // 更新调整后价差 (A - B - zero)
                const adjusted = (point.close - currentZeroValue).toFixed(4);
                adjustedSpread.innerText = adjusted;

                modeBadge.innerHTML = currentMode === 'intraday' ?
                    '<i class="fas fa-clock"></i> 1分钟 · 触摸点' :
                    '<i class="fas fa-calendar-alt"></i> 日K · 触摸点';

                // 移动端定位优化 (尽量保证在屏幕内)
                if (param.point) {
                    const chartRect = chartElement.getBoundingClientRect();
                    let left = param.point.x + chartRect.left + 10;
                    let top = param.point.y + chartRect.top - 90;
                    const tooltipWidth = 250;
                    const tooltipHeight = 220;
                    if (left + tooltipWidth > window.innerWidth) {
                        left = param.point.x + chartRect.left - tooltipWidth - 10;
                    }
                    if (left < 5) left = 5;
                    if (top < 10) top = param.point.y + chartRect.top + 20;
                    if (top + tooltipHeight > window.innerHeight) {
                        top = window.innerHeight - tooltipHeight - 10;
                    }
                    tooltip.style.left = left + 'px';
                    tooltip.style.top = top + 'px';
                }
            });
        }

        // 主函数
        async function fetchAndRender(codeA, codeB, zeroVal) {
            try {
                document.getElementById('price1').innerText = '加载中';
                document.getElementById('price2').innerText = '加载中';
                document.getElementById('spreadValue').innerText = '--';
                adjustedSpread.innerText = '--';

                const [intraA, intraB, dailyA, dailyB] = await Promise.all([
                    fetchIntraday(codeA),
                    fetchIntraday(codeB),
                    fetchDaily(codeA),
                    fetchDaily(codeB)
                ]);

                const ok = updateCards(intraA, intraB, dailyA, dailyB, codeA, codeB, zeroVal);
                if (!ok) throw new Error('数据不完整');

                minuteKlineData = aggregateMinuteKline(intraA, intraB);
                dailyKlineData = buildDailyKline(dailyA, dailyB);

                if (currentMode === 'intraday') {
                    if (minuteKlineData.length > 0) {
                        lineSeries.setData(minuteKlineData.map(k => ({ time: k.time, value: k.close })));
                        chart.timeScale().fitContent();
                    }
                } else {
                    if (dailyKlineData.length > 0) {
                        candlestickSeries.setData(dailyKlineData);
                        chart.timeScale().fitContent();
                    }
                }

                setupCrosshairMove(); // 每次数据更新重新绑定 (实际上重复订阅也没事，但保险只调一次？可以移出去，但这里保留不会导致多次)
            } catch (err) {
                console.error(err);
                document.getElementById('price1').innerText = '错误';
                document.getElementById('price2').innerText = '错误';
                document.getElementById('spreadValue').innerText = '--';
                adjustedSpread.innerText = '--';
                alert('数据加载失败，请检查网络或稍后重试。');
            }
        }

        // 初始加载
        fetchAndRender('511660', '511990', 0);

        // 更新按钮
        document.getElementById('updateBtn').addEventListener('click', () => {
            const code1 = document.getElementById('code1').value.trim().toUpperCase() || '511660';
            const code2 = document.getElementById('code2').value.trim().toUpperCase() || '511990';
            const zeroVal = parseFloat(document.getElementById('zeroValue').value) || 0;
            fetchAndRender(code1, code2, zeroVal);
        });

        // 自动刷新 (延长到2分钟避免过于频繁)
        setInterval(() => {
            const code1 = document.getElementById('code1').value.trim().toUpperCase() || '511660';
            const code2 = document.getElementById('code2').value.trim().toUpperCase() || '511990';
            const zeroVal = parseFloat(document.getElementById('zeroValue').value) || 0;
            fetchAndRender(code1, code2, zeroVal);
        }, 120000);

        // 窗口resize
        window.addEventListener('resize', () => {
            chart.applyOptions({
                width: chartElement.clientWidth,
                height: chartElement.clientHeight,
            });
        });

        // 鼠标/触摸移出图表区
        chartElement.addEventListener('mouseleave', () => {
            tooltip.style.display = 'none';
            tooltip.style.opacity = '0';
            modeBadge.innerHTML = '<i class="fas fa-mouse-pointer"></i> 触摸查看';
            if (intradayData1 && intradayData2) {
                const last1 = intradayData1.line[intradayData1.line.length - 1];
                const last2 = intradayData2.line[intradayData2.line.length - 1];
                document.getElementById('spreadValue').innerText = (last1[1] - last2[1]).toFixed(4);
                // 更新调整后价差
                const adjusted = (last1[1] - last2[1] - currentZeroValue).toFixed(4);
                adjustedSpread.innerText = adjusted;
            }
        });

        // 针对触屏增加 touchend 隐藏提示（可选）
        chartElement.addEventListener('touchend', (e) => {
            // 不立即隐藏，让用户有时间看，但如果有其他交互，保留原有逻辑
        });

    })();
</script>
