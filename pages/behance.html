<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 多端适配核心：响应式视口 + 缩放控制 -->
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <meta http-equiv="Access-Control-Allow-Origin" content="*">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes">
    <title>📈 价差 · 全端适配 (A-B-零值 + 5min)</title>
    <!-- TradingView Lightweight Charts (稳定版) -->
    <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
    <!-- Font Awesome 6 免费图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ----- 全局设计变量 & 重置 ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        body {
            background: #0c0f1c;
            background: radial-gradient(circle at 30% 40%, #1b2c42 0%, #030614 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: clamp(8px, 2vw, 20px);
        }

        /* 主卡片 */
        .dashboard {
            width: 100%;
            max-width: 1400px;
            background: rgba(10, 22, 38, 0.75);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: clamp(28px, 4vw, 44px);
            border: 1px solid rgba(74, 158, 255, 0.3);
            padding: clamp(16px, 3vw, 28px) clamp(14px, 2.5vw, 30px);
            box-shadow: 0 40px 70px -40px black, 0 0 0 1px rgba(0, 180, 255, 0.15) inset;
        }

        /* 头部区域 */
        .header {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 16px 20px;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: clamp(1.6rem, 5vw, 2.2rem);
            font-weight: 600;
            background: linear-gradient(145deg, #eaf3ff, #7ab7ff, #3d8cff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.3px;
            text-shadow: 0 0 30px #3b82f6aa;
        }

        .header h1 i {
            color: #fcd34d;
            filter: drop-shadow(0 0 12px #fbbf24);
            font-size: 1.2em;
        }

        /* 输入面板 */
        .input-panel {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 8px 12px;
            background: rgba(0, 15, 30, 0.6);
            padding: 10px 20px;
            border-radius: 60px;
            border: 1px solid #3d70b0;
            box-shadow: 0 0 16px #3b82f640, inset 0 1px 2px #ffffff15;
            backdrop-filter: blur(8px);
            flex: 1 1 auto;
            min-width: min(400px, 100%);
        }

        .code-input, .zero-input {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #3865a0;
            color: white;
            padding: 12px 10px;
            border-radius: 40px;
            font-size: 1rem;
            text-align: center;
            outline: none;
            transition: 0.2s;
            font-weight: 500;
            backdrop-filter: blur(4px);
            flex: 1 1 100px;
            min-width: 90px;
        }

        .zero-input {
            border-color: #f0b400;
            background: rgba(25, 20, 0, 0.4);
            box-shadow: 0 0 8px #f0b40050;
            flex: 0.8 1 80px;
        }

        .code-input:focus, .zero-input:focus {
            border-color: #ffd966;
            box-shadow: 0 0 24px #f0b400c0;
            background: rgba(30, 40, 60, 0.8);
        }

        .operator-symbol {
            color: #fbbf24;
            font-size: 1.8rem;
            font-weight: 600;
            text-shadow: 0 0 12px #f59e0b;
            line-height: 1;
        }

        .update-btn {
            background: linear-gradient(145deg, #2563eb, #1e3f8f);
            border: 1px solid #7ab7ff;
            color: white;
            padding: 12px 24px;
            border-radius: 42px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 8px 20px -8px #1e3f8f, 0 0 25px #3b82f680;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            flex: 0 1 auto;
        }

        .update-btn:active { transform: scale(0.97); }

        /* 信息卡片网格 */
        .info-cards {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            margin: 28px 0 24px;
        }

        @media (min-width: 600px) {
            .info-cards {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .card {
            background: rgba(10, 24, 42, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 30px;
            padding: 20px 22px;
            border: 1px solid #2e4b7c;
            box-shadow: 0 20px 30px -16px black;
            transition: all 0.2s;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #b3ceff;
            font-size: 1.05rem;
            margin-bottom: 12px;
        }

        .card-header i { color: #3b82f6; width: 24px; font-size: 1.2rem; }

        .price-large {
            font-size: clamp(2rem, 5vw, 2.8rem);
            font-weight: 600;
            color: white;
            text-shadow: 0 0 20px #3b82f6;
            line-height: 1.2;
        }

        .price-small {
            font-size: 1rem;
            color: #a0c0ff;
            margin-left: 8px;
        }

        .range-info {
            display: flex;
            gap: 20px;
            color: #9bb9f0;
            font-size: 0.95rem;
            margin-top: 12px;
        }

        .spread-card {
            background: linear-gradient(145deg, #12263b, #04182a);
            border: 1.5px solid #f0b400;
            box-shadow: 0 0 30px #f0b40030;
        }
        .spread-card .card-header { color: #ffe484; }
        .spread-large {
            font-size: clamp(2.4rem, 6vw, 3.4rem);
            font-weight: 700;
            background: linear-gradient(145deg, #fff6c0, #ffb82e);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1.1;
            text-shadow: 0 0 25px #ffb347;
        }

        .time-tag {
            color: #7f9fd0;
            font-size: 0.85rem;
            margin-top: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .mode-badge {
            background: #142845;
            padding: 4px 14px;
            border-radius: 40px;
            color: #b3d0ff;
            font-size: 0.75rem;
            border: 1px solid #3d70b0;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        /* 图表切换 */
        .chart-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 20px 0 16px;
        }

        .chart-tab {
            background: rgba(0, 20, 40, 0.6);
            border: 1px solid #325a8c;
            color: #b3ceff;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.15s;
            backdrop-filter: blur(8px);
            flex: 0 1 auto;
            text-align: center;
            min-width: 80px;
        }

        .chart-tab.active {
            background: linear-gradient(145deg, #2563eb, #1a3e7c);
            color: white;
            border-color: #f0b400;
            box-shadow: 0 0 20px #3b82f6a0;
        }

        /* 图表容器 */
        .chart-container {
            width: 100%;
            height: clamp(340px, 50vh, 500px);
            background: #030c1a;
            border-radius: 36px;
            border: 1px solid #2e4b7c;
            padding: 4px;
            margin: 15px 0 20px;
            box-shadow: 0 30px 45px -18px black;
        }

        #kline-chart {
            width: 100%;
            height: 100%;
            border-radius: 32px;
        }

        /* 底部状态栏 */
        .footer-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            color: #7f9fd0;
            border-top: 1px solid #1d3a60;
            padding-top: 20px;
            margin-top: 10px;
            gap: 14px;
            font-size: 0.9rem;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 30, 40, 0.5);
            padding: 4px 12px;
            border-radius: 30px;
        }

        .live-dot {
            width: 10px; height: 10px; background: #2ecc71;
            border-radius: 50%; box-shadow: 0 0 18px #2ecc71;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { opacity: 0.7; transform: scale(1); } 50% { opacity: 1; transform: scale(1.2); } }

        /* 触摸提示框 */
        .crosshair-tooltip {
            position: fixed;
            background: rgba(8, 22, 38, 0.98);
            backdrop-filter: blur(18px);
            border: 1px solid #f0b400;
            border-radius: 28px;
            padding: 14px 18px;
            color: white;
            font-size: 0.9rem;
            box-shadow: 0 30px 50px -20px black, 0 0 0 1px #f0b400 inset;
            pointer-events: none;
            z-index: 1000;
            min-width: 250px;
            max-width: 300px;
            transition: opacity 0.1s;
            border-left: 4px solid #f0b400;
        }

        .crosshair-tooltip .time {
            color: #ffd966; font-size: 1rem; font-weight: 600;
            margin-bottom: 6px; border-bottom: 1px solid #3265a5; padding-bottom: 4px;
        }
        .crosshair-tooltip .price-row { display: flex; justify-content: space-between; margin: 6px 0; }
        .crosshair-tooltip .kline-detail {
            margin-top: 8px; padding-top: 6px; border-top: 1px solid #3265a5;
            display: grid; grid-template-columns: 1fr 1fr; gap: 4px 8px;
        }
        .crosshair-tooltip .spread-highlight {
            grid-column: span 2; background: rgba(240, 180, 0, 0.15);
            border-radius: 20px; padding: 6px; text-align: center; color: #f0b400; font-weight: 700;
        }

        @media (max-width: 420px) {
            .input-panel { border-radius: 32px; padding: 12px 8px; }
            .code-input, .zero-input { padding: 10px 5px; font-size: 0.9rem; }
            .chart-tab { padding: 8px 16px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>
<div class="dashboard">
    <div class="header">
        <h1><i class="fas fa-chart-scatter"></i> 价差·全端</h1>
        <div class="input-panel">
            <input type="text" class="code-input" id="code1" value="511660" placeholder="代码A">
            <span class="operator-symbol">−</span>
            <input type="text" class="code-input" id="code2" value="511990" placeholder="代码B">
            <span class="operator-symbol">−</span>
            <input type="text" class="zero-input" id="zeroValue" value="0" placeholder="零值">
            <button class="update-btn" id="updateBtn"><i class="fas fa-sync-alt"></i> 更新</button>
        </div>
    </div>

    <div class="info-cards">
        <div class="card">
            <div class="card-header"><i class="fas fa-chart-line"></i> <span id="code1Display">511660</span></div>
            <div><span class="price-large" id="price1">--</span> <span class="price-small" id="change1"></span></div>
            <div class="range-info"><span><i class="fas fa-arrow-up" style="color:#4ade80;"></i> <span id="high1">--</span></span><span><i class="fas fa-arrow-down" style="color:#f87171;"></i> <span id="low1">--</span></span></div>
            <div class="time-tag" id="time1"><i class="far fa-clock"></i> --:--:--</div>
        </div>
        <div class="card">
            <div class="card-header"><i class="fas fa-chart-line"></i> <span id="code2Display">511990</span></div>
            <div><span class="price-large" id="price2">--</span> <span class="price-small" id="change2"></span></div>
            <div class="range-info"><span><i class="fas fa-arrow-up" style="color:#4ade80;"></i> <span id="high2">--</span></span><span><i class="fas fa-arrow-down" style="color:#f87171;"></i> <span id="low2">--</span></span></div>
            <div class="time-tag" id="time2"><i class="far fa-clock"></i> --:--:--</div>
        </div>
        <div class="card spread-card">
            <div class="card-header"><i class="fas fa-not-equal" style="color:#f0b400;"></i> 价差 (<span id="code1Short">660</span>-<span id="code2Short">990</span>-<span id="zeroDisplayHeader">0</span>)</div>
            <div class="spread-large" id="spreadValue">--</div>
            <div class="range-info"><span><i class="fas fa-arrow-up" style="color:#4ade80;"></i> <span id="spreadHigh">--</span></span><span><i class="fas fa-arrow-down" style="color:#f87171;"></i> <span id="spreadLow">--</span></span></div>
            <div class="time-tag"><span class="mode-badge" id="modeBadge"><i class="fas fa-fingerprint"></i> 滑动查看详情</span></div>
        </div>
    </div>

    <div class="chart-tabs">
        <div class="chart-tab active" id="tabIntraday"><i class="fas fa-clock"></i> 1分钟</div>
        <div class="chart-tab" id="tab5min"><i class="fas fa-hourglass-half"></i> 5分钟</div>
        <div class="chart-tab" id="tabDaily"><i class="fas fa-calendar-alt"></i> 日K</div>
    </div>

    <div class="chart-container">
        <div id="kline-chart"></div>
    </div>

    <div class="footer-bar">
        <div class="live-indicator"><span class="live-dot"></span> 上证所 · 实时</div>
        <div><i class="fa-regular fa-hand-pointer"></i> 触摸/悬停看细节</div>
        <div><i class="fa-regular fa-keyboard"></i> 价差 = A-B-零值</div>
    </div>
</div>

<div id="crosshairTooltip" class="crosshair-tooltip" style="display: none;">
    <div class="time" id="tooltipTime">--:--:--</div>
    <div class="price-row"><span class="label" id="tooltipCode1Label">511660:</span> <span class="value" id="tooltipPrice1">--</span></div>
    <div class="price-row"><span class="label" id="tooltipCode2Label">511990:</span> <span class="value" id="tooltipPrice2">--</span></div>
    <div class="kline-detail" id="tooltipDetail">
        <div><span class="label">开:</span> <span class="value" id="tooltipOpen">--</span></div>
        <div><span class="label">高:</span> <span class="value" id="tooltipHigh">--</span></div>
        <div><span class="label">低:</span> <span class="value" id="tooltipLow">--</span></div>
        <div><span class="label">收:</span> <span class="value" id="tooltipClose">--</span></div>
        <div class="spread-highlight" id="tooltipSpread">价差: --</div>
    </div>
</div>

<script>
    (function() {
        const chartElement = document.getElementById('kline-chart');

        // 创建图表
        const chart = LightweightCharts.createChart(chartElement, {
            width: chartElement.clientWidth,
            height: chartElement.clientHeight,
            layout: { background: { color: '#061020' }, textColor: '#c4d4ff' },
            grid: { vertLines: { color: '#1f3155' }, horzLines: { color: '#1f3155' } },
            timeScale: { timeVisible: true, secondsVisible: false, borderColor: '#3260a5' },
            rightPriceScale: { borderColor: '#3260a5' },
            crosshair: { vertLine: { labelBackgroundColor: '#3b82f6', style: 1 }, horzLine: { labelBackgroundColor: '#3b82f6', style: 1 } },
            watermark: { text: '价差 (A-B-零值)', color: 'rgba(59,130,246,0.2)', fontSize: 18 }
        });

        // 全部使用折线图 (因为显示的是价差)
        const lineSeries1min = chart.addLineSeries({
            color: '#f0b400',
            lineWidth: 2,
            priceFormat: { precision: 4, minMove: 0.0001 },
            title: '1分钟价差'
        });

        const lineSeries5min = chart.addLineSeries({
            color: '#60a5fa',
            lineWidth: 2,
            priceFormat: { precision: 4, minMove: 0.0001 },
            title: '5分钟价差'
        });

        const lineSeriesDaily = chart.addLineSeries({
            color: '#4ade80',
            lineWidth: 2,
            priceFormat: { precision: 4, minMove: 0.0001 },
            title: '日线价差'
        });

        // 初始显示1分钟
        lineSeries1min.applyOptions({ visible: true });
        lineSeries5min.applyOptions({ visible: false });
        lineSeriesDaily.applyOptions({ visible: false });

        // DOM 快捷获取
        const $ = id => document.getElementById(id);
        const tooltip = $('crosshairTooltip');
        const tooltipTime = $('tooltipTime');
        const tooltipPrice1 = $('tooltipPrice1');
        const tooltipPrice2 = $('tooltipPrice2');
        const tooltipOpen = $('tooltipOpen');
        const tooltipHigh = $('tooltipHigh');
        const tooltipLow = $('tooltipLow');
        const tooltipClose = $('tooltipClose');
        const tooltipSpread = $('tooltipSpread');
        const modeBadge = $('modeBadge');
        const tooltipCode1Label = $('tooltipCode1Label');
        const tooltipCode2Label = $('tooltipCode2Label');
        const zeroInput = $('zeroValue');
        const zeroDisplayHeader = $('zeroDisplayHeader');
        const spreadValueEl = $('spreadValue');
        const spreadHighEl = $('spreadHigh');
        const spreadLowEl = $('spreadLow');

        // 状态变量
        let intradayData1, intradayData2, dailyData1, dailyData2, data5min1, data5min2;
        let currentCode1 = '511660', currentCode2 = '511990', currentZeroValue = 0;
        let currentMode = 'intraday';
        let minuteKlineData = [], dailyKlineData = [], kline5minData = [];

        // ----- 获取5分钟K线 -----
        function fetch5minKline(code) {
            const cb = 'jQuery_5min_' + Date.now() + '_' + Math.floor(Math.random()*1e6);
            return new Promise((resolve, reject) => {
                window[cb] = function(data) { delete window[cb]; script.remove(); resolve(data); };
                const script = document.createElement('script');
                script.src = `https://yunhq.sse.com.cn:32042/v1/sh1/minutek/${code}?callback=${cb}&begin=-500&end=-1&period=5min&_=${Date.now()}`;
                script.onerror = () => { delete window[cb]; script.remove(); reject(); };
                document.head.appendChild(script);
                setTimeout(() => { if(window[cb]) { delete window[cb]; script.remove(); reject(); } }, 8000);
            });
        }

        // ----- 获取分时数据 -----
        function fetchIntraday(code) {
            const cb = 'jQuery_intra_' + Date.now() + '_' + Math.floor(Math.random()*1e6);
            return new Promise((resolve, reject) => {
                window[cb] = function(data) { delete window[cb]; script.remove(); resolve(data); };
                const script = document.createElement('script');
                script.src = `https://yunhq.sse.com.cn:32042/v1/sh1/line/${code}?callback=${cb}&select=time%2Cprice%2Cvolume%2Cavg_price%2Camount%2Chighest%2Clowest&_=${Date.now()}`;
                script.onerror = () => { delete window[cb]; script.remove(); reject(); };
                document.head.appendChild(script);
                setTimeout(() => { if(window[cb]) { delete window[cb]; script.remove(); reject(); } }, 8000);
            });
        }

        // ----- 获取日K线 -----
        function fetchDaily(code) {
            const cb = 'jQuery_daily_' + Date.now() + '_' + Math.floor(Math.random()*1e6);
            return new Promise((resolve, reject) => {
                window[cb] = function(data) { delete window[cb]; script.remove(); resolve(data); };
                const script = document.createElement('script');
                script.src = `https://yunhq.sse.com.cn:32042/v1/sh1/dayk/${code}?callback=${cb}&begin=-500&end=-1&period=day&_=${Date.now()}`;
                script.onerror = () => { delete window[cb]; script.remove(); reject(); };
                document.head.appendChild(script);
                setTimeout(() => { if(window[cb]) { delete window[cb]; script.remove(); reject(); } }, 8000);
            });
        }

        // ----- 时间转换函数 -----
        function timeToTimestamp(dateStr, timeNum) {
            const d = String(dateStr);
            const year = parseInt(d.slice(0,4));
            const month = parseInt(d.slice(4,6)) - 1;
            const day = parseInt(d.slice(6,8));
            if (timeNum !== undefined) {
                const t = String(timeNum).padStart(6,'0');
                return Date.UTC(year, month, day, parseInt(t.slice(0,2)), parseInt(t.slice(2,4)), parseInt(t.slice(4,6))) / 1000;
            }
            return Date.UTC(year, month, day) / 1000;
        }

        // ----- 聚合1分钟K线 (价差) -----
        function aggregateMinuteKline(d1, d2) {
            const map = new Map();
            for (let i=0, len=Math.min(d1.line.length, d2.line.length); i<len; i++) {
                const a = d1.line[i], b = d2.line[i];
                if (a[0] !== b[0]) continue;
                const ts = timeToTimestamp(d1.date, a[0]);
                const spread = a[1] - b[1];
                if (!map.has(ts)) {
                    map.set(ts, {
                        time: ts,
                        open: spread,
                        high: spread,
                        low: spread,
                        close: spread,
                        price1: a[1],
                        price2: b[1],
                        timeStr: String(a[0]).padStart(6,'0').replace(/(..)(..)(..)/,'$1:$2:$3')
                    });
                } else {
                    const k = map.get(ts);
                    k.high = Math.max(k.high, spread);
                    k.low = Math.min(k.low, spread);
                    k.close = spread;
                }
            }
            return [...map.values()].sort((a,b)=>a.time-b.time);
        }

        // ----- 构建5分钟K线 (价差) - 修复版 -----
        function build5minKline(d1, d2) {
            if (!d1?.kline?.length || !d2?.kline?.length) return [];
            const map2 = new Map(d2.kline.map(item => [item[0], item]));
            const res = [];

            d1.kline.forEach(i1 => {
                const i2 = map2.get(i1[0]);
                if (!i2) return;

                // 解析14位时间戳: YYYYMMDDHHMMSS
                const timeFull = String(i1[0]);
                const year = parseInt(timeFull.slice(0, 4));
                const month = parseInt(timeFull.slice(4, 6)) - 1;
                const day = parseInt(timeFull.slice(6, 8));
                const hour = parseInt(timeFull.slice(8, 10));
                const minute = parseInt(timeFull.slice(10, 12));
                const second = parseInt(timeFull.slice(12, 14)) || 0;

                // 生成秒级时间戳
                const ts = Date.UTC(year, month, day, hour, minute, second) / 1000;

                // 计算价差 (注意：数据索引: [时间, 开, 高, 低, 收, 成交量, 成交额])
                const spread = i1[4] - i2[4];  // 用收盘价计算价差

                res.push({
                    time: ts,
                    value: spread,  // 折线图只需要value
                    open: spread,   // 保留用于显示
                    high: spread,
                    low: spread,
                    close: spread,
                    price1: i1[4],
                    price2: i2[4],
                    timeStr: `${hour.toString().padStart(2,'0')}:${minute.toString().padStart(2,'0')}:${second.toString().padStart(2,'0')}`
                });
            });

            return res.sort((a, b) => a.time - b.time);
        }

        // ----- 构建日K线 (价差) -----
        function buildDailyKline(d1, d2) {
            const map2 = new Map(d2.kline.map(item => [item[0], item]));
            const res = [];
            d1.kline.forEach(i1 => {
                const i2 = map2.get(i1[0]);
                if (!i2) return;
                const spread = i1[4] - i2[4];  // 用收盘价计算价差
                res.push({
                    time: timeToTimestamp(i1[0]),
                    value: spread,
                    open: spread,
                    high: spread,
                    low: spread,
                    close: spread,
                    price1: i1[4],
                    price2: i2[4],
                    dateStr: String(i1[0])
                });
            });
            return res.sort((a,b)=>a.time-b.time);
        }

        // ----- 更新卡片UI -----
        function updateCards(intra1, intra2, daily1, daily2, five1, five2, code1, code2, zero) {
            if (!intra1?.line?.length || !intra2?.line?.length) return false;

            intradayData1 = intra1;
            intradayData2 = intra2;
            dailyData1 = daily1;
            dailyData2 = daily2;
            data5min1 = five1;
            data5min2 = five2;
            currentCode1 = code1;
            currentCode2 = code2;
            currentZeroValue = zero;

            const last1 = intra1.line[intra1.line.length - 1];
            const last2 = intra2.line[intra2.line.length - 1];

            $('code1Display').innerText = code1;
            $('code2Display').innerText = code2;
            $('code1Short').innerText = code1.slice(3);
            $('code2Short').innerText = code2.slice(3);
            zeroDisplayHeader.innerText = zero;
            tooltipCode1Label.innerText = code1 + ':';
            tooltipCode2Label.innerText = code2 + ':';

            // 品种A
            $('price1').innerText = last1[1].toFixed(3);
            $('high1').innerText = intra1.highest.toFixed(3);
            $('low1').innerText = intra1.lowest.toFixed(3);
            const chg1 = ((last1[1] - intra1.prev_close) / intra1.prev_close * 100).toFixed(2);
            $('change1').innerHTML = (chg1 > 0 ? '+' : '') + chg1 + '%';
            $('change1').style.color = chg1 >= 0 ? '#4ade80' : '#f87171';
            const timeStr1 = String(last1[0]).padStart(6,'0');
            $('time1').innerHTML = `<i class="far fa-clock"></i> ${timeStr1.slice(0,2)}:${timeStr1.slice(2,4)}:${timeStr1.slice(4,6)}`;

            // 品种B
            $('price2').innerText = last2[1].toFixed(3);
            $('high2').innerText = intra2.highest.toFixed(3);
            $('low2').innerText = intra2.lowest.toFixed(3);
            const chg2 = ((last2[1] - intra2.prev_close) / intra2.prev_close * 100).toFixed(2);
            $('change2').innerHTML = (chg2 > 0 ? '+' : '') + chg2 + '%';
            $('change2').style.color = chg2 >= 0 ? '#4ade80' : '#f87171';
            const timeStr2 = String(last2[0]).padStart(6,'0');
            $('time2').innerHTML = `<i class="far fa-clock"></i> ${timeStr2.slice(0,2)}:${timeStr2.slice(2,4)}:${timeStr2.slice(4,6)}`;

            // 价差
            const adjusted = (last1[1] - last2[1] - zero).toFixed(4);
            spreadValueEl.innerText = adjusted;

            let maxS = -Infinity, minS = Infinity;
            for (let i=0, len=Math.min(intra1.line.length, intra2.line.length); i<len; i++) {
                const s = intra1.line[i][1] - intra2.line[i][1];
                maxS = Math.max(maxS, s);
                minS = Math.min(minS, s);
            }
            spreadHighEl.innerText = (maxS - zero).toFixed(4);
            spreadLowEl.innerText = (minS - zero).toFixed(4);

            return true;
        }

        // ----- 查找数据点 -----
        function findDataPointByTimestamp(ts) {
            let arr = [];
            if (currentMode === 'intraday') arr = minuteKlineData;
            else if (currentMode === '5min') arr = kline5minData;
            else arr = dailyKlineData;

            if (!arr.length) return null;
            return arr.reduce((best, cur) => Math.abs(cur.time - ts) < Math.abs(best.time - ts) ? cur : best);
        }

        // ----- 设置十字光标 -----
        function setupCrosshairMove() {
            chart.subscribeCrosshairMove(param => {
                if (!param.time) {
                    tooltip.style.display = 'none';
                    modeBadge.innerHTML = '<i class="fas fa-fingerprint"></i> 滑动查看详情';
                    return;
                }

                const point = findDataPointByTimestamp(param.time);
                if (!point) return;

                tooltip.style.display = 'block';

                // 时间显示
                if (currentMode === 'intraday') {
                    tooltipTime.innerText = point.timeStr;
                } else if (currentMode === '5min') {
                    tooltipTime.innerText = point.timeStr;
                } else {
                    tooltipTime.innerText = `${point.dateStr.slice(0,4)}-${point.dateStr.slice(4,6)}-${point.dateStr.slice(6,8)}`;
                }

                // 价格显示
                tooltipPrice1.innerText = point.price1?.toFixed(3) || '--';
                tooltipPrice2.innerText = point.price2?.toFixed(3) || '--';

                // 价差显示 (减去零值)
                const spreadAdj = (point.close - currentZeroValue).toFixed(4);
                tooltipOpen.innerText = spreadAdj;
                tooltipHigh.innerText = spreadAdj;
                tooltipLow.innerText = spreadAdj;
                tooltipClose.innerText = spreadAdj;
                tooltipSpread.innerText = `价差: ${spreadAdj}`;
                spreadValueEl.innerText = spreadAdj;

                // 模式标签
                modeBadge.innerHTML = currentMode === 'intraday' ? '<i class="fas fa-clock"></i> 1分点' :
                    (currentMode === '5min' ? '<i class="fas fa-hourglass-half"></i> 5分点' :
                        '<i class="fas fa-calendar"></i> 日K点');

                // 提示框位置
                if (param.point) {
                    const rect = chartElement.getBoundingClientRect();
                    let left = param.point.x + rect.left + 8;
                    let top = param.point.y + rect.top - 70;
                    const w = 260, h = 240;
                    if (left + w > window.innerWidth) left = param.point.x + rect.left - w - 8;
                    if (top < 5) top = param.point.y + rect.top + 20;
                    if (top + h > window.innerHeight) top = window.innerHeight - h - 8;
                    tooltip.style.left = left + 'px';
                    tooltip.style.top = top + 'px';
                }
            });
        }

        // ----- 主获取逻辑 -----
        async function fetchAndRender(codeA, codeB, zero) {
            try {
                $('price1').innerText = '⌛';
                $('price2').innerText = '⌛';
                spreadValueEl.innerText = '--';

                const [intraA, intraB, dailyA, dailyB, fiveA, fiveB] = await Promise.all([
                    fetchIntraday(codeA),
                    fetchIntraday(codeB),
                    fetchDaily(codeA),
                    fetchDaily(codeB),
                    fetch5minKline(codeA),
                    fetch5minKline(codeB)
                ]);

                if (!updateCards(intraA, intraB, dailyA, dailyB, fiveA, fiveB, codeA, codeB, zero)) throw new Error();

                // 构建各周期价差数据
                minuteKlineData = aggregateMinuteKline(intraA, intraB);
                dailyKlineData = buildDailyKline(dailyA, dailyB);
                kline5minData = build5minKline(fiveA, fiveB);

                // 根据当前模式显示对应系列
                if (currentMode === 'intraday' && minuteKlineData.length) {
                    lineSeries1min.setData(minuteKlineData.map(k => ({ time: k.time, value: k.close - zero })));
                    lineSeries1min.applyOptions({ visible: true });
                    lineSeries5min.applyOptions({ visible: false });
                    lineSeriesDaily.applyOptions({ visible: false });
                    chart.timeScale().fitContent();
                } else if (currentMode === '5min' && kline5minData.length) {
                    lineSeries5min.setData(kline5minData.map(k => ({ time: k.time, value: k.close - zero })));
                    lineSeries1min.applyOptions({ visible: false });
                    lineSeries5min.applyOptions({ visible: true });
                    lineSeriesDaily.applyOptions({ visible: false });
                    chart.timeScale().fitContent();
                } else if (currentMode === 'daily' && dailyKlineData.length) {
                    lineSeriesDaily.setData(dailyKlineData.map(d => ({ time: d.time, value: d.close - zero })));
                    lineSeries1min.applyOptions({ visible: false });
                    lineSeries5min.applyOptions({ visible: false });
                    lineSeriesDaily.applyOptions({ visible: true });
                    chart.timeScale().fitContent();
                }

                setupCrosshairMove();
            } catch (e) {
                console.warn(e);
                $('price1').innerText = 'ERR';
                $('price2').innerText = 'ERR';
                spreadValueEl.innerText = '--';
            }
        }

        // ----- 选项卡切换 -----
        $('tabIntraday').addEventListener('click', () => {
            $('tabIntraday').classList.add('active');
            $('tab5min').classList.remove('active');
            $('tabDaily').classList.remove('active');
            currentMode = 'intraday';

            if (minuteKlineData.length) {
                lineSeries1min.setData(minuteKlineData.map(k => ({ time: k.time, value: k.close - currentZeroValue })));
                lineSeries1min.applyOptions({ visible: true });
                lineSeries5min.applyOptions({ visible: false });
                lineSeriesDaily.applyOptions({ visible: false });
                chart.timeScale().fitContent();
            } else {
                lineSeries1min.applyOptions({ visible: true });
                lineSeries5min.applyOptions({ visible: false });
                lineSeriesDaily.applyOptions({ visible: false });
            }
        });

        $('tab5min').addEventListener('click', () => {
            $('tab5min').classList.add('active');
            $('tabIntraday').classList.remove('active');
            $('tabDaily').classList.remove('active');
            currentMode = '5min';

            if (kline5minData.length) {
                lineSeries5min.setData(kline5minData.map(k => ({ time: k.time, value: k.close - currentZeroValue })));
                lineSeries1min.applyOptions({ visible: false });
                lineSeries5min.applyOptions({ visible: true });
                lineSeriesDaily.applyOptions({ visible: false });
                chart.timeScale().fitContent();
            } else {
                lineSeries1min.applyOptions({ visible: false });
                lineSeries5min.applyOptions({ visible: true });
                lineSeriesDaily.applyOptions({ visible: false });
            }
        });

        $('tabDaily').addEventListener('click', () => {
            $('tabDaily').classList.add('active');
            $('tabIntraday').classList.remove('active');
            $('tab5min').classList.remove('active');
            currentMode = 'daily';

            if (dailyKlineData.length) {
                lineSeriesDaily.setData(dailyKlineData.map(d => ({ time: d.time, value: d.close - currentZeroValue })));
                lineSeries1min.applyOptions({ visible: false });
                lineSeries5min.applyOptions({ visible: false });
                lineSeriesDaily.applyOptions({ visible: true });
                chart.timeScale().fitContent();
            } else {
                lineSeries1min.applyOptions({ visible: false });
                lineSeries5min.applyOptions({ visible: false });
                lineSeriesDaily.applyOptions({ visible: true });
            }
        });

        // ----- 更新按钮 -----
        $('updateBtn').addEventListener('click', () => {
            const c1 = $('code1').value.trim().toUpperCase() || '511660';
            const c2 = $('code2').value.trim().toUpperCase() || '511990';
            const zv = parseFloat($('zeroValue').value) || 0;
            fetchAndRender(c1, c2, zv);
        });

        // ----- 自动刷新 (2分钟) -----
        setInterval(() => {
            const c1 = $('code1').value.trim().toUpperCase() || '511660';
            const c2 = $('code2').value.trim().toUpperCase() || '511990';
            const zv = parseFloat($('zeroValue').value) || 0;
            fetchAndRender(c1, c2, zv);
        }, 120000);

        // ----- 窗口大小变化 -----
        window.addEventListener('resize', () => {
            chart.applyOptions({
                width: chartElement.clientWidth,
                height: chartElement.clientHeight
            });
        });

        // ----- 鼠标离开图表区 -----
        chartElement.addEventListener('mouseleave', () => {
            tooltip.style.display = 'none';
            modeBadge.innerHTML = '<i class="fas fa-fingerprint"></i> 滑动查看详情';
        });

        // 初始加载
        fetchAndRender('511660', '511990', 0);
    })();
</script>
</body>
</html>
