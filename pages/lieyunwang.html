            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);

            max-width: 600px;
        }
        h1 {
            color: #28a745;
            font-size: 48px;
            margin-bottom: 20px;
        }
        p {
            color: #666;
            font-size: 18px;
            line-height: 1.6;

        .btn {
            display: inline-block;

            padding: 15px 40px;
            background: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-size: 18px;
